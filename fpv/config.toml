# Ловец-FPV — конфиг. Правится прямо на GitHub (файл → карандаш → commit).

[bot]
daily_leads      = 3         # сколько агентств выдавать в день (3 — не палимся с автоматизацией)
lead_hour_msk    = 10        # порция дня выдаётся при первом запуске после этого часа
active_hours_msk = [9, 23]   # вне этих часов (МСК) запуск сразу выходит

[kp]
# Телефон — Кирилла (28.07.2026). Почта пока SAF (safpelerin) — заменить при полной передаче
portfolio_url = "https://disk.yandex.ru/i/oSy9SyNYqCMWoQ"   # примеры работ, Кирилл 05.10.2026
author_name   = "WildProps"
author_phone  = "+7 906 076-52-52"
subject       = "WildProps — FPV-видеотур для объектов {agency}"

# Прайс Кирилла от 05.10.2026: цена зависит от площади объекта.
# Упор в КП: уникальный по доходчивости способ показать жильё удалённо.
prices = """FPV-видеотур (4K) под ключ — непрерывный пролёт одним кадром:
фасад, интерьеры, участок, окружение. Стоимость зависит от площади объекта:
— 50–300 м² — 55 000 ₽
— 300–600 м² — 66 000 ₽
— 600–1 000 м² — 88 000 ₽
— 1 000–3 000 м² — 110 000 ₽
Покупатель «проходит» по объекту с экрана и приезжает только на осознанный показ.
За съёмочный день — до 3–4 объектов. Готовый ролик — через 1–2 дня."""

# ── Массовая рассылка (кампания) ──────────────────────────────────────
# Одно письмо по всей базе: нейросеть не участвует, берётся текст ниже,
# {agency} заменяется названием агентства. Порция daily_limit писем в день
# с паузой pause_sec между письмами — чтобы Gmail не счёл это спамом.
# Запуск: кнопка «📨 Рассылка» в боте → превью → «▶️ Запустить».
[broadcast]
daily_limit = 15      # писем в день (больше 30 — риск спам-фильтра)
pause_sec   = 45      # пауза между письмами внутри порции
send_hours  = [9, 19]   # окно МСК, когда уходят письма (вне — ждём утра)
# Текст письма — от Кирилла (04.10.2026). Подстановка {agency} только в теме:
# тело универсальное, без упоминания агентства — так задумано.
subject     = "Съёмка объектов {agency} — облёт одним непрерывным кадром"
body = """Здравствуйте! 90 секунд - и покупатель уже понимает, ехать смотреть объект или нет.

Снимаю недвижимость одним непрерывным кадром, без склеек: двор, окна, переходы между этажами - всё как при личном визите, только заранее. На загородке особенно заметно - метраж участка фото просто не вмещает.

Итог простой: на просмотр приезжают уже мотивированные покупатели - меньше пустых визитов, быстрее сделка.

8+ лет в съёмке недвижимости, сотни объектов. Час-два на площадке, готовое видео - через день-два.

Скинуть пару примеров под ваши объекты?

Кирилл
+7 906 076-52-52
WildProps
Telegram @Kirill_WildProps
Instagram @wildprops
"""

# Оплата. В письмах — одна строка. Крипту в КП НЕ упоминаем (внутреннее
# правило: если клиент сам просит крипту — можно, решается в переговорах).
payment = "безналичная оплата на счёт ИП (УСН)"

# Шаблон-запаска: используется, если нейросеть недоступна
template = """Здравствуйте!

Фотография показывает, как выглядит дом. FPV одним кадром показывает,
как в нём ощущается жизнь.

Мы — {author}, студия FPV-съёмки премиальной недвижимости. Снимаем
объект одним непрерывным кадром, глазами гостя: фасад, гостиная,
кухня, участок, второй этаж — без единой склейки. Покупатель проходит
по дому за пару минут и приезжает на показ уже «тёплым» — пустых
просмотров становится меньше.

За плечами — 8+ лет работы с дронами и сотни снятых объектов без
единого инцидента, включая самые дорогие интерьеры.

Примеры: {portfolio}

Формат и цена:
{prices}

{payment}

Пришлёте адрес объекта — посчитаем и предложим маршрут пролёта.

{author} · архитектура впечатления
{phone}"""

[llm]
enabled  = true              # персонализация КП + черновики ответов
provider = "chad"            # ChadGPT (подписка SAF) · "openai" = OpenRouter/AITunnel/ProxyAPI · "anthropic" = Claude
api_base = "https://openrouter.ai/api/v1"   # используется только для provider="openai"
model    = "claude-3.7-sonnet"   # у Chad; запасной вариант: gpt-5.2. Для openai: qwen/qwen3-next-80b-a3b-instruct:free
# бесплатные модели бывают перегружены — тогда бот пробует запасные по очереди:
fallback_models = [
  "meta-llama/llama-3.3-70b-instruct:free",
  "google/gemma-4-31b-it:free",
  "openai/gpt-oss-20b:free",
]
# ключ — в секрете GitHub LLM_API_KEY (openrouter.ai → Keys)

[email]
enabled   = true
smtp_host = "smtp.gmail.com"   # тест на safpelerin@gmail.com; для Яндекса: smtp.yandex.ru
smtp_port = 465
imap_host = "imap.gmail.com"   # чтение ответов агентств; для Яндекса: imap.yandex.ru
# логин/пароль приложения — в секретах GitHub: SMTP_USER, SMTP_PASS

[negotiation]
enabled = true   # ответы агентств: Claude готовит черновик, отправка по кнопке в TG

[followup]
enabled    = true
after_days = 4   # нет ответа N дней → одно вежливое напоминание (уходит само)
template = """Здравствуйте!

Несколько дней назад отправлял предложение по FPV-видеотурам для объектов
{agency} — на случай, если письмо затерялось, коротко продублирую:
снимаю недвижимость пролётом одним кадром, примеры и цены здесь: {portfolio}

Если тема актуальна — пришлите адрес любого объекта, посчитаю стоимость
в тот же день. Если нет — просто не отвечайте, больше не потревожу.

{author}
{phone}"""
