# ─────────────────────────────────────────────────────────────────────
# Описание бизнеса. Это единственный файл, который нужно заполнить,
# чтобы запустить ловца под новое дело. Всё остальное — поисковые
# запросы, промпты, тексты писем — берётся отсюда.
#
# Файл кладётся в корень репозитория рядом с config.toml.
# ─────────────────────────────────────────────────────────────────────

[business]
name       = "WildProps"
what       = "FPV-видеосъёмка недвижимости: облёт объекта одним непрерывным кадром, без склеек"
who_i_am   = "Кирилл, снимаю недвижимость с дрона, 8+ лет, сотни объектов"
client     = "агентства недвижимости, застройщики, риелторы Москвы и Подмосковья"
city       = "Москва и Московская область"
value      = "клиент ощущает масштаб объекта до личного визита — на показ приезжают более мотивированные покупатели"

[search]
# Запросы для веб-поиска. Пишите так, как искали бы клиента сами.
# Курсор крутится по списку, так что чем их больше, тем дольше
# поиск не начнёт возвращать одно и то же.
queries = [
  "агентство недвижимости Москва контакты",
  "агентство элитной недвижимости Москва",
  "агентство загородной недвижимости Подмосковье",
  "застройщик коттеджных посёлков Подмосковье отдел продаж",
  "риелтор Новая Рига Рублёвка продажа домов",
  "агентство недвижимости Москва новостройки отдел продаж",
  "продажа таунхаусов Подмосковье агентство",
  "девелопер загородной недвижимости Московская область",
]
gl             = "ru"    # страна выдачи
hl             = "ru"    # язык выдачи
max_pages      = 5       # до какой страницы выдачи заходить по каждому запросу
fetch_contacts = true    # заходить на сайт и снимать почту

[replenish]
min_new_leads  = 100     # сколько доступных лидов держать в запасе
batch_size     = 50      # потолок кандидатов за один подход
buffer_percent = 30      # искать с запасом: часть окажется дублями
max_attempts   = 3       # попыток за прогон — защита от зацикливания
